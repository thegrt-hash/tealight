; Tealight fleet controller
; Target: Seeed Studio XIAO ESP32-S3
;
;   pio run                 -> compile firmware
;   pio run -t uploadfs     -> upload the web UI (data/) to LittleFS
;   pio run -t upload       -> flash firmware over USB-C
;   pio device monitor      -> serial log @ 115200
;
; Flash order for a fresh board: uploadfs, then upload.

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs

monitor_speed = 115200
build_flags = -DMONITOR_SPEED=115200

lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.1
    esp32async/AsyncTCP @ 3.5.0
    esp32async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ 7.4.3
