; Mini color-changing LED tealight
; Target: Seeed Studio XIAO ESP32-C3
;
;   pio run            -> compile
;   pio run -t upload  -> flash over USB-C
;   pio device monitor -> serial log @ 115200

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
build_flags = -DMONITOR_SPEED=115200

; Default partition reserves only ~1.25MB/app (dual-OTA). WiFi+BLE+web server
; overflows that. huge_app = single 3MB app slot (no OTA) on the XIAO's 4MB flash.
board_build.partitions = huge_app.csv

lib_deps =
    fastled/FastLED @ ^3.6.0
    h2zero/NimBLE-Arduino @ 2.5.1
    bblanchon/ArduinoJson @ 7.4.3
